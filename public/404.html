<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Shivam Chhanchhan</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0D0B;
      color: #ECF3EC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #171C13;
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 48px 32px;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #34D399;
      margin-bottom: 16px;
      font-weight: 700;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: #9BAA9C;
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    a {
      display: inline-block;
      background: #34D399;
      color: #0A0D0B;
      padding: 12px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.15s ease;
    }
    a:hover {
      background: #5EEAD4;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">404 Error</p>
    <h1>Page Not Found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a href="/">Return to Portfolio</a>
  </div>
</body>
</html>
