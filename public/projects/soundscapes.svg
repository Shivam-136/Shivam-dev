<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1418"/>
      <stop offset="100%" stop-color="#080C0E"/>
    </linearGradient>
    <radialGradient id="glow2" cx="40%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)"/>
  <circle cx="350" cy="220" r="300" fill="url(#glow2)"/>

  <!-- Grid -->
  <g stroke="#ECF3EC" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#11181D" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="40" rx="12" fill="#152128"/>
  <circle cx="65" cy="50" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="82" cy="50" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="99" cy="50" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="55" fill="#9BAA9C" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">soundscape-landing-page.vercel.app</text>

  <!-- Audio Equalizer Bars / Ambient Scene -->
  <g fill="#38BDF8" opacity="0.85">
    <rect x="220" y="190" width="16" height="50" rx="4"/>
    <rect x="246" y="160" width="16" height="80" rx="4"/>
    <rect x="272" y="140" width="16" height="100" rx="4"/>
    <rect x="298" y="175" width="16" height="65" rx="4"/>
    <rect x="324" y="125" width="16" height="115" rx="4"/>
    <rect x="350" y="150" width="16" height="90" rx="4"/>
    <rect x="376" y="110" width="16" height="130" rx="4" fill="#5EEAD4"/>
    <rect x="402" y="130" width="16" height="110" rx="4" fill="#5EEAD4"/>
    <rect x="428" y="155" width="16" height="85" rx="4"/>
    <rect x="454" y="135" width="16" height="105" rx="4"/>
    <rect x="480" y="170" width="16" height="70" rx="4"/>
    <rect x="506" y="150" width="16" height="90" rx="4"/>
    <rect x="532" y="180" width="16" height="60" rx="4"/>
    <rect x="558" y="200" width="16" height="40" rx="4"/>
  </g>

  <!-- Title & Status -->
  <text x="400" y="305" fill="#ECF3EC" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Soundscapes Platform</text>
  <text x="400" y="335" fill="#9BAA9C" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Ambient Audio Mixing &amp; Live Scene Streaming</text>

  <!-- Badges -->
  <rect x="270" y="365" width="70" height="22" rx="4" fill="#182733" stroke="#38BDF8" stroke-opacity="0.3"/>
  <text x="305" y="380" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">HTML5</text>

  <rect x="350" y="365" width="60" height="22" rx="4" fill="#182733" stroke="#38BDF8" stroke-opacity="0.3"/>
  <text x="380" y="380" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">CSS3</text>

  <rect x="420" y="365" width="95" height="22" rx="4" fill="#182733" stroke="#F7DF1E" stroke-opacity="0.3"/>
  <text x="467" y="380" fill="#F7DF1E" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">JAVASCRIPT</text>
</svg>
