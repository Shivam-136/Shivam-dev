<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1410"/>
      <stop offset="100%" stop-color="#080B09"/>
    </linearGradient>
    <radialGradient id="glow" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <circle cx="500" cy="200" r="300" fill="url(#glow)"/>
  
  <!-- Grid -->
  <g stroke="#ECF3EC" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="#121814" stroke="#34D399" stroke-opacity="0.2" stroke-width="1.5"/>
  <rect x="40" y="30" width="720" height="40" rx="12" fill="#171F1A"/>
  <circle cx="65" cy="50" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="82" cy="50" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="99" cy="50" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="55" fill="#9BAA9C" font-family="system-ui, sans-serif" font-size="12" font-weight="500" text-anchor="middle">nexa-voice-assistant.vercel.app</text>

  <!-- Central AI Interface Graphic -->
  <circle cx="400" cy="210" r="55" fill="#1B2620" stroke="#34D399" stroke-width="2"/>
  <circle cx="400" cy="210" r="40" fill="#203328" stroke="#5EEAD4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Microphone / Waveform icon -->
  <path d="M394 195 a6 6 0 0 1 12 0 v18 a6 6 0 0 1 -12 0 z M388 207 a12 12 0 0 0 24 0 M400 220 v9 M392 229 h16" fill="none" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Waveform lines -->
  <g stroke="#34D399" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="280" y1="210" x2="280" y2="210"/>
    <line x1="300" y1="200" x2="300" y2="220"/>
    <line x1="320" y1="185" x2="320" y2="235"/>
    <line x1="340" y1="170" x2="340" y2="250"/>
    <line x1="460" y1="170" x2="460" y2="250"/>
    <line x1="480" y1="185" x2="480" y2="235"/>
    <line x1="500" y1="200" x2="500" y2="220"/>
    <line x1="520" y1="210" x2="520" y2="210"/>
  </g>

  <!-- Title & Status -->
  <text x="400" y="320" fill="#ECF3EC" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Nexa AI Voice Assistant</text>
  <text x="400" y="348" fill="#9BAA9C" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Real-time Speech Recognition &amp; Conversational AI</text>

  <!-- Badges -->
  <rect x="255" y="372" width="60" height="22" rx="4" fill="#1C2821" stroke="#34D399" stroke-opacity="0.3"/>
  <text x="285" y="387" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">REACT</text>

  <rect x="325" y="372" width="68" height="22" rx="4" fill="#1C2821" stroke="#34D399" stroke-opacity="0.3"/>
  <text x="359" y="387" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">NODE.JS</text>

  <rect x="403" y="372" width="72" height="22" rx="4" fill="#1C2821" stroke="#34D399" stroke-opacity="0.3"/>
  <text x="439" y="387" fill="#34D399" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">MONGODB</text>

  <rect x="485" y="372" width="60" height="22" rx="4" fill="#1C2821" stroke="#5EEAD4" stroke-opacity="0.3"/>
  <text x="515" y="387" fill="#5EEAD4" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">AI VOICE</text>
</svg>
